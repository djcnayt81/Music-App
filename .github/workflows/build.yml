name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and Inspect Files
        run: |
          unzip -o *.zip || true
          echo "=== FILES FOUND ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            cd $(dirname "$GRADLE_PATH")
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No Gradle project found. Checking web files..."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-apk
          path: "**/*.apk"
          if-no-files-found: ignore
